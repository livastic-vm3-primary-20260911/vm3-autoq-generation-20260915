name: VM3 Mergify repo token org defaults probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare GitHub and Mergify GET and PUT authorization
        env:
          GH_REPO_TOKEN: ${{ github.token }}
        run: |
          set -u
          owner='livastic-vm3-mergify-lab-0911'
          mutated=0
          restore() {
            if [ "$mutated" = 1 ]; then
              code=$(curl -sS -o /tmp/restore.json -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer $GH_REPO_TOKEN" \
                -H 'Accept: application/json' \
                -H 'Content-Type: application/json' \
                --data '{"products":[]}' \
                "https://api.mergify.com/v1/default_products/$owner")
              echo "mergify_restore_trap_status=$code"
            fi
          }
          trap restore EXIT INT TERM

          gh_status=$(curl -sS -o /tmp/gh-org.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/orgs/$owner/actions/permissions")
          get_status=$(curl -sS -o /tmp/get.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.mergify.com/v1/default_products/$owner")
          put_status=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"products":["ci_insights"]}' \
            "https://api.mergify.com/v1/default_products/$owner")

          echo "github_org_actions_permissions_status=$gh_status"
          echo "mergify_default_products_get_status=$get_status"
          echo "mergify_default_products_put_status=$put_status"

          if [ "$put_status" = 204 ]; then
            mutated=1
            after_status=$(curl -sS -o /tmp/after.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_REPO_TOKEN" \
              -H 'Accept: application/json' \
              "https://api.mergify.com/v1/default_products/$owner")
            echo "mergify_after_put_get_status=$after_status"
            printf 'mergify_after_put_body='; cat /tmp/after.json; echo
            restore_now=$(curl -sS -o /tmp/restore-now.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $GH_REPO_TOKEN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data '{"products":[]}' \
              "https://api.mergify.com/v1/default_products/$owner")
            echo "mergify_restore_now_status=$restore_now"
            if [ "$restore_now" = 204 ]; then mutated=0; fi
          fi

          final_status=$(curl -sS -o /tmp/final.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.mergify.com/v1/default_products/$owner")
          echo "mergify_final_get_status=$final_status"
          if [ "$final_status" = 200 ]; then
            printf 'mergify_final_body='; cat /tmp/final.json; echo
          fi
