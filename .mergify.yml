scopes:
  source:
    files:
      alpha:
        include:
          - alpha/**/*
      beta:
        include:
          - beta/**/*
  barrier_files:
    include:
      - global.txt
merge_queue:
  mode: parallel
  max_parallel_checks: 2
queue_rules:
  - name: default
    batch_size: 1
pull_request_rules: []
